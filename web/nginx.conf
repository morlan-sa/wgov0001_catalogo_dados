server {
    listen 8080;

    root /usr/share/nginx/html;
    index index.html;

    # Mesmo conjunto do rnc2/web (nginx.conf.template) — sem HSTS aqui de
    # propósito: este nginx nunca termina TLS (fala HTTP puro por trás do
    # ALB compartilhado), então o cabeçalho pertence à infra que termina
    # TLS de verdade (plataforma-infra), não a este container.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # No /api/ proxy here on purpose. A literal proxy_pass target (like the
    # `server` hostname this line used to point at) is resolved once at
    # nginx's own startup — "server" only exists as a hostname in local
    # docker-compose, so this crashed the whole container outright the
    # instant it ran anywhere else, ECS included (confirmed in rnc2/web:
    # every deploy since this line was added got silently rolled back by
    # the ECS deployment circuit breaker, for months, with the site quietly
    # stuck serving a stale build the entire time). It was also never doing
    # anything in production regardless: plataforma-infra's app catalog
    # routes /api/* straight to the API's own ECS service at the ALB,
    # before nginx ever sees the request (see apps.tf's `routes` block —
    # every app pairs a path_patterns=["/api/*"] rule at a lower priority
    # number than the web service's host-only catch-all). If your app's
    # infra ever deviates from that shared pattern, wire a *working*,
    # env-configurable upstream back in — don't restore this literal one.
}
